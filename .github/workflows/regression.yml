name: API Automated Regression

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyTest API Suite
      env:
        AUTH_USER: ${{ secrets.AUTH_USER }}
        AUTH_PASS: ${{ secrets.AUTH_PASS }}
      # We add 'continue-on-error: true' so the pipeline doesn't crash before uploading the report if a test fails
      run: |
        pytest tests/api/ -v --html=reports/ci_report.html
      continue-on-error: true 

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      with:
        name: API-Test-Report
        path: reports/ci_report.html